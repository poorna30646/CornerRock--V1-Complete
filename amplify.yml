version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        # Amplify makes console variables available to the build only. This writes
        # the allowlisted server runtime variables to an ignored file that Next.js
        # can load for the deployed SSR compute runtime.
        - node scripts/write-amplify-runtime-env.mjs
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
